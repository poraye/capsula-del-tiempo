<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lectura de la carta 💌</title>
  <link rel="stylesheet" href="pantalla-lectura.css" />
</head>
<body>
  <main class="card">
    <h1>Tu carta 💖</h1>
    <p id="metaCarta" class="muted">Cargando carta...</p>

    <section id="resultado" class="hidden">
      <h2 id="tituloCarta"></h2>
      <article id="textoCarta" class="letter"></article>
    </section>

    <p id="estado" class="status">Preparando lectura…</p>
  </main>

  <script src="pantalla-lectura.js"></script>
</body>
</html>
